<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Only For You ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Georgia', 'Times New Roman', serif;
      background:
        radial-gradient(circle at top, rgba(255, 105, 180, 0.25), transparent 35%),
        linear-gradient(135deg, #09000f, #16001f, #000000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      color: rgba(255, 182, 193, 0.45);
      animation: floatUp 8s linear infinite;
      font-size: 18px;
    }

    @keyframes floatUp {
      from {
        transform: translateY(110vh) scale(0.7);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      to {
        transform: translateY(-20vh) scale(1.4);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 26px;
      padding: 28px 22px;
      backdrop-filter: blur(14px);
      box-shadow: 0 0 35px rgba(255, 75, 145, 0.35);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: rgba(255, 255, 255, 0.78);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      border-radius: 999px;
      padding: 14px 16px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.14);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      background: linear-gradient(135deg, #ff5fa2, #ff2f75);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 47, 117, 0.35);
    }

    button:active {
      transform: scale(0.97);
    }

    .mood-hints {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.62);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .letter {
      display: none;
      margin-top: 18px;
      padding: 22px;
      text-align: left;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: fadeIn 0.7s ease forwards;
      line-height: 1.75;
      font-size: 1.02rem;
      white-space: pre-line;
    }

    .letter h2 {
      text-align: center;
      margin-top: 0;
      font-size: 1.45rem;
      color: #ffd1e3;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer-note {
      margin-top: 20px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.45);
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
        align-items: flex-start;
        padding-top: 42px;
      }

      .card {
        padding: 24px 17px;
        border-radius: 24px;
      }

      h1 {
        font-size: 1.65rem;
      }

      .input-row {
        flex-direction: column;
      }

      button, input {
        width: 100%;
      }

      .letter {
        font-size: 0.98rem;
        padding: 19px;
      }
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <main class="card">
    <h1>Only for you ❤️</h1>
    <p class="subtitle">
      Type your mood, my Cutie. Whatever you feel today, there is a small letter waiting for you here.
    </p>

    <div class="input-row">
      <input id="moodInput" type="text" placeholder="happy, sad, bored, miss me..." />
      <button onclick="showLetter()">Open</button>
    </div>

    <div class="mood-hints">
      Try: happy • sad • bored • tired • angry • miss me • overthinking • loved
    </div>

    <section class="letter" id="letterBox"></section>

    <p class="footer-note">A tiny secret corner made just for Queen.</p>
  </main>

  <script>
    const letters = {
      miss: {
        title: "When you miss me",
        text: `My Queen 👑,

Yeah yeah… I already know what you’re going to say.
You’re going to say you don’t miss me.

But I know you better than that 😌

You may act like you don’t miss me some days…
but somewhere inside, I know you do 🥺
Maybe you won’t admit it… maybe you’ll pretend you’re fine…
but your jester knows the truth.

And me?

I don’t even try to hide it.
I miss you everywhere… random moments… quiet places…
even when I’m doing something normal and suddenly wishing you were next to me.

Some things just feel incomplete without you.

I’ll just say it properly.

I miss you. A lot ❤️

So go on… act like you don’t miss me…
your jester knows better 😌`
      },

      sad: {
        title: "When you’re sad",
        text: `My Queen 🤍,

I know today feels heavy.

And I know this isn’t one of your easy days.

You don’t have to act strong right now.
You don’t have to pretend like everything is okay.

Even the strongest people get tired sometimes…
even the strongest people feel low.

Whatever it is college, people, home, or just everything piling up
you don’t have to carry it all by yourself.

And yeah… I know myself 😭
My mind will automatically start thinking how to fix everything…
how to solve your problem… how to make it better somehow.

But with you…

I don’t always want to fix it immediately.

Sometimes I just want to sit with you…
stay close…
and make sure you don’t feel alone 🥺

You don’t have to rush to feel okay.
You don’t have to explain everything.

Just know I’m here.

You’ll get through this.
You always do.

And while you’re getting through it…
I’m right here.

Your jester 🤍`
      },

      happy: {
        title: "When you’re happy",
        text: `My ketchup packet 😭❤️,

Yeah yeah I know… you hate that name.
But I had to start like that.

If you’re happy right now… I’m already smiling like an idiot here 😌

This is my favorite version of you…
smiling… glowing… laughing… just being fully you without overthinking everything.

You deserve this 🥺
You deserve soft days… happy moments… peace in your heart.

So don’t question it.
Don’t overthink it.

Just enjoy it.

Stay like this for as long as you can, my Queen ❤️

Your jester is definitely enjoying this version of you 😌`
      },

      alone: {
        title: "When you feel alone",
        text: `My Queen 🤍,

I know there are moments where everything feels quiet…

Too quiet.

Like no one really understands…
like you’re just carrying things silently by yourself.

But listen to me properly.

You are not alone.

Not just when things are easy…
not just when you’re happy…

Even now… you still have me.

You have someone who chooses you.
Someone who listens.
Someone who stays.

Even if everything around you feels distant…
I’m still right here 🥺

You don’t have to carry this alone anymore 🤍`
      },

      bored: {
        title: "When you feel bored",
        text: `My bored little Peppa Nigga 😭,

So the world got boring without your jester ah?

Expected 😌

Go think about us for a second…
all the random days… the stupid talks… the food…
the laughing for no reason 😂

We don’t even need anything big.

When it’s us… even normal things become special.

So if you’re bored right now, you have two options:

Think about us and smile like an idiot… 😌
or stop acting and text me.

Because clearly… I’m still your best entertainment 😤❤️`
      },

      tired: {
        title: "When you’re tired",
        text: `My Queen 👑,

Aiyo… today really drained you huh 🥺

I can already imagine you acting like you’re fine…
but I know when you’re like this… everything feels heavier than usual.

So listen properly.

You don’t have to do everything today.
You don’t have to push yourself like crazy.

You did enough.

Even if your brain says “no you didn’t”… ignore it 😤
It’s lying.

If I was there, I’d force you to sit down…
maybe irritate you a bit…
then make sure you actually rest properly 😌

So take it easy baby.

Your jester is right here 🤍`
      },

      sleepy: {
        title: "When you’re sleepy",
        text: `My sleepy Snorlax 😴❤️,

It’s almost 10:30 ah…

Which means you’re either half asleep…
or pretending like you’re not tired and still scrolling 😑

I know you…

“just 5 more minutes”
“one last thing”
“okay now I’ll sleep”

And somehow you’re still awake 😭

Go sleep.

Yes I’m serious 😤

Phone aside.
Eyes closed.
No overthinking.

This is your peaceful 10:30 sleep… don’t spoil it 😌

If I was there, I’d annoy you first…
then pull you close and make sure you actually sleep like the Snorlax you are 🥺❤️

Sleep properly okay?

Your jester will be right here when you wake up 🤍`
      },

      angry: {
        title: "When you’re angry",
        text: `My angry Queen 😤,

Okay first… breathe.

Second… don’t kill anyone.

Third… I’m on your side by default 😌

I know something annoyed you…
and yeah, sometimes people really test your patience.

But don’t let it ruin your whole day.

You have too good of a heart to let random things mess with your peace 🥺

Come rant to me.

Say everything.

I’ll listen… I might say something stupid…
but I’m not going anywhere 🤍`
      },

      overthinking: {
        title: "When you’re overthinking",
        text: `My love 🤍,

Stop for one second.

Your mind is making everything louder than it needs to be.

Not every thought is true.
Not every fear deserves your energy.

And listen… I’m saying this as someone who overthinks more than you 😭

So I know exactly how your brain goes from 0 to 100 for no reason.

So don’t compete with me in overthinking…
I’ll win easily 😌

But seriously…

Not everything your mind tells you is real.

So listen to me instead.

You are loved.
You are wanted.
You matter to me.

Nothing about you is “too much” for me 🥺

So whatever your brain is saying right now…

Let my voice be louder.

I choose you. Always 🤍`
      },

      loved: {
        title: "When you want to feel loved",
        text: `My Queen 👑,

You are loved.

Not just on your good days…
not just when you’re happy…

I love you when you’re quiet…
when you’re stressed…
when you’re dramatic 😭
when you act like you don’t miss me 😑

I love every version of you.

You’re my favorite person.
My peace.
My everything.

And yeah…

You receive my love ❤️
I receive physical abuse 🤕

Fair deal ah? 😌`
      },

      default: {
        title: "For whatever mood this is",
        text: `My Queen 👑,

I don’t know exactly what mood this is…
but I know one thing properly.

Whatever you’re feeling right now,
you still have me.

Good mood, bad mood, random mood, silent mood,
Peppa Nigga mood, Snorlax mood… anything 😭

You’re still my Queen.
And I’m still your jester.

So take this as your reminder:
you are loved,
you are missed,
and you’re very very special to me ❤️`
      }
    };

    function showLetter() {
      const input = document.getElementById("moodInput").value.toLowerCase().trim();
      const letterBox = document.getElementById("letterBox");

      let selected = letters.default;

      if (input.includes("miss") || input.includes("missing")) selected = letters.miss;
      else if (input.includes("sad") || input.includes("cry") || input.includes("upset") || input.includes("low") || input.includes("not okay") || input.includes("down")) selected = letters.sad;
      else if (input.includes("happy") || input.includes("good") || input.includes("excited") || input.includes("smile")) selected = letters.happy;
      else if (input.includes("alone") || input.includes("lonely") || input.includes("left out")) selected = letters.alone;
      else if (input.includes("bored") || input.includes("boring")) selected = letters.bored;
      else if (input.includes("sleepy") || input.includes("sleep") || input.includes("bed")) selected = letters.sleepy;
      else if (input.includes("tired") || input.includes("exhausted") || input.includes("drained")) selected = letters.tired;
      else if (input.includes("angry") || input.includes("mad") || input.includes("annoyed") || input.includes("irritated")) selected = letters.angry;
      else if (input.includes("overthink") || input.includes("anxious") || input.includes("scared") || input.includes("worried") || input.includes("fear")) selected = letters.overthinking;
      else if (input.includes("love") || input.includes("loved") || input.includes("unloved") || input.includes("care")) selected = letters.loved;

      letterBox.innerHTML = `<h2>${selected.title}</h2><p>${selected.text}</p>`;
      letterBox.style.display = "block";
      letterBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    document.getElementById("moodInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        showLetter();
      }
    });

    const heartsContainer = document.getElementById("hearts");

    for (let i = 0; i < 22; i++) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "♡";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDelay = Math.random() * 8 + "s";
      heart.style.animationDuration = 6 + Math.random() * 6 + "s";
      heart.style.fontSize = 14 + Math.random() * 18 + "px";
      heartsContainer.appendChild(heart);
    }
  </script>
</body>
</html>
